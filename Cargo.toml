[workspace]
resolver = "2"
members = ["crates/core", "crates/lang", "crates/store", "crates/forge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ealearn-core = { path = "crates/core" }
ealearn-lang = { path = "crates/lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
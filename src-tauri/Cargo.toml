[package]
name = "ealearn-app"
version = "0.1.0"
edition = "2021"
description = "EaLearn 桌面端"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ealearn-core = { path = "../crates/core" }
ealearn-lang = { path = "../crates/lang" }
ealearn-store = { path = "../crates/store" }
ealearn-llm = { path = "../crates/llm" }
ealearn-tts = { path = "../crates/tts" }

# 独立于根仓库的 workspace：GUI 依赖重，不拖慢 core 的测试循环
[workspace]
